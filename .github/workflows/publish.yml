name: Publish packages on NPM
on:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: '24.x'
                  registry-url: 'https://registry.npmjs.org/'
            - run: yarn
            - run: yarn run lerna publish from-package --yes
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Notify deployment success
              if: success()
              continue-on-error: true
              uses: zcong1993/actions-ding@master
              with:
                  dingToken: ${{ secrets.DING_TALK_TOKEN }}
                  secret: ${{ secrets.DING_TALK_SECRET }}
                  body: |
                      {
                        "msgtype": "markdown",
                        "markdown": {
                          "title": "fc-sdk-reactnative 发布通知",
                          "text": "### ✅ fc-sdk-reactnative 发布成功\n\n---\n\n 🔖 分支/标签: ${{ github.ref_name }}\n\n 📦 包: lerna 发布的 @flashcatcloud/* 全部包\n\n 👨‍💻 发布者: ${{ github.actor }}\n\n 🚀 [查看详情](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
                        }
                      }

            - name: Notify secondary DingTalk group on success
              if: success()
              continue-on-error: true
              uses: zcong1993/actions-ding@master
              with:
                  dingToken: ${{ secrets.DING_TALK_TOKEN_2 }}
                  secret: ${{ secrets.DING_TALK_SECRET_2 }}
                  body: |
                      {
                        "msgtype": "markdown",
                        "markdown": {
                          "title": "fc-sdk-reactnative 发布通知",
                          "text": "### ✅ fc-sdk-reactnative 发布成功\n\n---\n\n 🔖 分支/标签: ${{ github.ref_name }}\n\n 📦 包: lerna 发布的 @flashcatcloud/* 全部包\n\n 👨‍💻 发布者: ${{ github.actor }}\n\n 🚀 [查看详情](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
                        }
                      }

            - name: Notify deployment failure
              if: failure()
              continue-on-error: true
              uses: zcong1993/actions-ding@master
              with:
                  dingToken: ${{ secrets.DING_TALK_TOKEN }}
                  secret: ${{ secrets.DING_TALK_SECRET }}
                  body: |
                      {
                        "msgtype": "markdown",
                        "markdown": {
                          "title": "fc-sdk-reactnative 发布通知",
                          "text": "### ❌ fc-sdk-reactnative 发布失败\n\n---\n\n 🔖 分支/标签: ${{ github.ref_name }}\n\n 👨‍💻 发布者: ${{ github.actor }}\n\n 🚀 [查看详情](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
                        }
                      }
